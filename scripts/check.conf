# scripts/check.conf — steps behind ./scripts/check (generated at bootstrap, 2026-10-21).
# Stack: .NET 10 + Blazor + EF Core + SQL Server (docs/decisions/0002-*.md).
# One step per line: <name>: <command>. Runs in order, fails fast. [fast] steps = ./scripts/check --fast.
#
# Greenfield guard: until the first feature creates PolsanLeave.slnx, each step prints "skip" and
# passes. Once the solution exists the guard is inert. Remove it in the plan that creates the solution.
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene):
#   build/format/test -> MSBuild worker nodes, Roslyn VBCSCompiler, Razor build server
#     resource hygiene: no build servers (--disable-build-servers on every dotnet build/test)
#   test-integration  -> LocalDB instance (sqlservr.exe) keeps running after use
#     resource hygiene: dedicated instance PolsanLeaveTest stopped inside the same step, exit code kept
#   test-e2e          -> Kestrel + Playwright browser; owned by the test fixture (in-process
#     WebApplicationFactory), disposed on success, failure and timeout; headless, single worker
#
# Test split by selector, never by list (docs/testing.md, Two speeds rule 4):
#   fast = Category!=Integration&Category!=E2E ; full-only = Category=Integration, Category=E2E

build [fast]: [ -f PolsanLeave.slnx ] || { echo "skip: PolsanLeave.slnx not created yet (greenfield)"; exit 0; }; dotnet build PolsanLeave.slnx -c Release --disable-build-servers -nologo
format [fast]: [ -f PolsanLeave.slnx ] || { echo "skip: PolsanLeave.slnx not created yet (greenfield)"; exit 0; }; dotnet format PolsanLeave.slnx --verify-no-changes --no-restore
test-unit [fast]: [ -f PolsanLeave.slnx ] || { echo "skip: PolsanLeave.slnx not created yet (greenfield)"; exit 0; }; dotnet test PolsanLeave.slnx -c Release --no-build --disable-build-servers --nologo --filter "Category!=Integration&Category!=E2E"
vulnerable: [ -f PolsanLeave.slnx ] || { echo "skip: PolsanLeave.slnx not created yet (greenfield)"; exit 0; }; out=$(dotnet list PolsanLeave.slnx package --vulnerable --include-transitive --format json) || exit 1; if printf '%s' "$out" | grep -q '"vulnerabilities"'; then printf '%s\n' "$out"; echo "vulnerable packages found (docs/security.md, Dependencies)" >&2; exit 1; fi
test-integration: [ -f PolsanLeave.slnx ] || { echo "skip: PolsanLeave.slnx not created yet (greenfield)"; exit 0; }; own=0; if [ -z "${POLSANLEAVE_TEST_SQL:-}" ]; then own=1; sqllocaldb create PolsanLeaveTest >/dev/null 2>&1; sqllocaldb start PolsanLeaveTest >/dev/null || exit 1; fi; dotnet test PolsanLeave.slnx -c Release --no-build --disable-build-servers --nologo --filter "Category=Integration"; rc=$?; [ "$own" = 1 ] && sqllocaldb stop PolsanLeaveTest >/dev/null; exit $rc
test-e2e: [ -f PolsanLeave.slnx ] || { echo "skip: PolsanLeave.slnx not created yet (greenfield)"; exit 0; }; HEADED=0 dotnet test PolsanLeave.slnx -c Release --no-build --disable-build-servers --nologo --filter "Category=E2E" -- RunConfiguration.MaxCpuCount=1
