# scripts/check.conf — steps behind ./scripts/check (generated at bootstrap, 2026-10-21; plan 0001).
# Stack: .NET 10 + Blazor + EF Core + SQL Server (docs/decisions/0002-*.md).
# One step per line: <name>: <command>. Runs in order, fails fast. [fast] steps = ./scripts/check --fast.
#
# Test runner: Microsoft.Testing.Platform (global.json "test.runner"), xUnit v3, VSTest-style --filter.
# DOTNET_CLI_UI_LANGUAGE=en keeps the output parseable for the test-count guard below.
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene):
#   build/format      -> MSBuild worker nodes, Roslyn VBCSCompiler, Razor build server
#     resource hygiene: no build servers (--disable-build-servers on dotnet build)
#   test-*, vulnerable -> MSBuild nodes from dotnet test / dotnet list (restore) evaluation; without
#     the switch dotnet list alone leaves 15 nodeReuse:true workers (~1 GB, found by residue, plan 0001)
#     resource hygiene: no node reuse (MSBUILDDISABLENODEREUSE=1). Not --disable-build-servers:
#     MTP forwards it to the test app and breaks the handshake (silently zero tests).
#   test-integration  -> LocalDB instance (sqlservr.exe) keeps running after use
#     resource hygiene: dedicated instance PolsanLeaveTest stopped inside the same step, exit code kept
#   test-e2e          -> Kestrel + Playwright Chromium; owned by the E2EApp fixture (in-process
#     WebApplicationFactory.UseKestrel), disposed on success, failure and timeout; headless, single
#     worker (tests/PolsanLeave.E2E/xunit.runner.json); also needs the LocalDB instance, stopped in-step
#
# Test split by selector, never by list (docs/testing.md, Two speeds rule 4):
#   fast = Category!=Integration&Category!=E2E ; full-only = Category=Integration, Category=E2E
# --ignore-exit-code 8: a test project with no test matching the filter is normal (exit 8 = zero tests).
# Zero-test guard: a step whose total is 0 fails — no silent green. ANSI colour codes are stripped
# first: CI output prefixes the summary lines with them (plan 0001, D11). Armed on every test step
# (test-integration since plan 0001 step 3, test-e2e since step 9).

build [fast]: dotnet build PolsanLeave.slnx -c Release --disable-build-servers -nologo
format [fast]: dotnet format PolsanLeave.slnx --verify-no-changes --no-restore
test-unit [fast]: out=$(DOTNET_CLI_UI_LANGUAGE=en MSBUILDDISABLENODEREUSE=1 dotnet test --solution PolsanLeave.slnx -c Release --no-build --filter "Category!=Integration&Category!=E2E" --ignore-exit-code 8 2>&1); rc=$?; printf '%s\n' "$out" | tail -8; [ $rc -eq 0 ] || exit $rc; printf '%s\n' "$out" | sed 's/\x1b\[[0-9;]*m//g' | grep -Eq '^ *total: *[1-9]' || { echo "zero tests ran (docs/testing.md, Two speeds rule 4)" >&2; exit 1; }
vulnerable: out=$(MSBUILDDISABLENODEREUSE=1 dotnet list PolsanLeave.slnx package --vulnerable --include-transitive --format json) || exit 1; if printf '%s' "$out" | grep -q '"vulnerabilities"'; then printf '%s\n' "$out"; echo "vulnerable packages found (docs/security.md, Dependencies)" >&2; exit 1; fi
test-integration: own=0; if [ -z "${POLSANLEAVE_TEST_SQL:-}" ]; then own=1; sqllocaldb create PolsanLeaveTest >/dev/null 2>&1; sqllocaldb start PolsanLeaveTest >/dev/null || exit 1; fi; out=$(DOTNET_CLI_UI_LANGUAGE=en MSBUILDDISABLENODEREUSE=1 dotnet test --solution PolsanLeave.slnx -c Release --no-build --filter "Category=Integration" --ignore-exit-code 8 2>&1); rc=$?; [ "$own" = 1 ] && sqllocaldb stop PolsanLeaveTest >/dev/null; printf '%s\n' "$out" | tail -8; [ $rc -eq 0 ] || exit $rc; printf '%s\n' "$out" | sed 's/\x1b\[[0-9;]*m//g' | grep -Eq '^ *total: *[1-9]' || { echo "zero tests ran (docs/testing.md, Two speeds rule 4)" >&2; exit 1; }
test-e2e: own=0; if [ -z "${POLSANLEAVE_TEST_SQL:-}" ]; then own=1; sqllocaldb create PolsanLeaveTest >/dev/null 2>&1; sqllocaldb start PolsanLeaveTest >/dev/null || exit 1; fi; out=$(HEADED=0 DOTNET_CLI_UI_LANGUAGE=en MSBUILDDISABLENODEREUSE=1 dotnet test --solution PolsanLeave.slnx -c Release --no-build --filter "Category=E2E" --ignore-exit-code 8 2>&1); rc=$?; [ "$own" = 1 ] && sqllocaldb stop PolsanLeaveTest >/dev/null; printf '%s\n' "$out" | tail -8; [ $rc -eq 0 ] || exit $rc; printf '%s\n' "$out" | sed 's/\x1b\[[0-9;]*m//g' | grep -Eq '^ *total: *[1-9]' || { echo "zero tests ran (docs/testing.md, Two speeds rule 4)" >&2; exit 1; }
