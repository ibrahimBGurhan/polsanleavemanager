name: check
on:
  push:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doctor diffs specs/done/ against the PR's merge-base; a shallow clone has no base
      - name: Workspace health (spec/plan gates are failures in CI)
        run: ./scripts/doctor --strict
      - name: Self-test (scripts/check, doctor and residue behave as documented)
        run: ./scripts/selftest

  check:
    runs-on: ubuntu-latest
    # Integration tests: real SQL Server (LocalDB is Windows-only) — docs/testing.md, Frameworks & layout.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
    env:
      POLSANLEAVE_TEST_SQL: Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_MSSQL_SA_PASSWORD }};TrustServerCertificate=True
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
        if: hashFiles('global.json') != ''
      # E2E (docs/testing.md): Playwright's Chromium, installed from the built test project.
      - name: Playwright browser
        if: hashFiles('global.json') != ''
        run: |
          dotnet build tests/PolsanLeave.E2E -c Release
          pwsh tests/PolsanLeave.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      # --fast is for the inner loop only; CI always runs the full contract (docs/testing.md).
      - name: Verification contract
        run: |
          if [ -f scripts/check.conf ]; then
            ./scripts/check
          else
            echo "scripts/check.conf not present yet (pre-bootstrap) — skipping."
          fi
